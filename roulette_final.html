<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X3NA トークルーレット</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.08);
    --text: #f0eff8;
    --muted: rgba(240,239,248,0.45);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(192,132,252,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(244,114,182,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 40px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.35em; color: var(--muted); margin-bottom: 28px; text-align: center; text-transform: uppercase; }

  .phase-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
  }
  .phase-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .phase-dot.active { background: #c084fc; box-shadow: 0 0 8px rgba(192,132,252,0.6); }
  .phase-dot.done { background: rgba(192,132,252,0.4); }
  .phase-label { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; margin-left: 4px; }

  .wheel-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin-bottom: 32px;
    flex-shrink: 0;
  }
  .wheel-glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(192,132,252,0.15) 0%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.6;transform:scale(0.95)} 50%{opacity:1;transform:scale(1.05)} }
  #wheel { width: 320px; height: 320px; border-radius: 50%; display: block; position: relative; z-index: 1; }
  .pointer {
    position: absolute; right: -18px; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 0; height: 0;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    border-right: 26px solid #f472b6;
    filter: drop-shadow(0 0 8px rgba(244,114,182,0.6));
  }

  .spin-btn {
    background: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
    border: none; color: #fff;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 18px; font-weight: 700;
    padding: 16px 64px; border-radius: 100px; cursor: pointer;
    letter-spacing: 0.1em; margin-bottom: 32px;
    transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 32px rgba(192,132,252,0.4);
  }
  .spin-btn:hover { transform: scale(1.04); box-shadow: 0 0 48px rgba(192,132,252,0.6); }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { opacity: 0.35; cursor: default; transform: none; box-shadow: none; }

  .reset-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px; font-weight: 700;
    padding: 8px 28px; border-radius: 100px; cursor: pointer;
    letter-spacing: 0.08em; margin-bottom: 32px;
    transition: border-color 0.2s, color 0.2s;
    display: none;
  }
  .reset-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .reset-btn.visible { display: block; }

  .result-panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 28px;
    margin-bottom: 28px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: border-color 0.4s, box-shadow 0.4s;
    position: relative;
    overflow: hidden;
  }
  .result-panel.lit {
    border-color: rgba(192,132,252,0.4);
    box-shadow: 0 0 40px rgba(192,132,252,0.1), inset 0 0 60px rgba(192,132,252,0.03);
  }
  .result-panel.lit-q {
    border-color: rgba(244,114,182,0.5);
    box-shadow: 0 0 40px rgba(244,114,182,0.12), inset 0 0 60px rgba(244,114,182,0.04);
  }
  .result-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192,132,252,0.5), transparent);
    opacity: 0; transition: opacity 0.4s;
  }
  .result-panel.lit::before, .result-panel.lit-q::before { opacity: 1; }

  .result-idle { color: var(--muted); font-size: 15px; letter-spacing: 0.05em; }

  .result-category {
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s 0.1s, transform 0.4s 0.1s;
  }
  .result-panel.lit .result-category,
  .result-panel.lit-q .result-category { opacity: 1; transform: translateY(0); }

  .result-topic {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 0;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.4s 0.2s, transform 0.4s 0.2s;
  }
  .result-panel.lit .result-topic,
  .result-panel.lit-q .result-topic { opacity: 1; transform: translateY(0); }

  .result-q-block {
    width: 100%;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: left;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.5s 0.15s, transform 0.5s 0.15s;
  }
  .result-panel.lit-q .result-q-block { opacity: 1; transform: translateY(0); }

  .result-q-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .result-q-text { font-size: 20px; font-weight: 700; line-height: 1.5; color: var(--text); }

  .slots-section { width: 100%; }
  .slots-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; text-align: center; }
  .slots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .slot-item.active {
    border-color: var(--slot-color, rgba(192,132,252,0.5));
    background: var(--surface2);
  }
  .slot-name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .slot-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .slot-qs-text { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .slot-q-active { font-size: 11px; line-height: 1.7; font-weight: 700; }
</style>
</head>

  <div class="title">トークルーレット</div>

  <div class="phase-indicator">
    <div class="phase-dot active" id="dot0"></div>
    <div class="phase-dot" id="dot1"></div>
    <div class="phase-label" id="phase-label">STEP 1 — テーマを選ぶ</div>
  </div>

  <div class="wheel-container">
    <div class="wheel-glow"></div>
    <canvas id="wheel" width="320" height="320"></canvas>
    <div class="pointer"></div>
  </div>

  <button class="spin-btn" id="spin-btn" onclick="spin()">まわす</button>
  <button class="reset-btn" id="reset-btn" onclick="reset()">もう一度はじめから</button>

  <div class="result-panel" id="result-panel">
    <div class="result-idle" id="result-idle">ルーレットを回してテーマを決めよう</div>
    <div class="result-category" id="result-category"></div>
    <div class="result-topic" id="result-topic"></div>
    <div class="result-q-block" id="result-q-block">
      <div class="result-q-label">今回の質問</div>
      <div class="result-q-text" id="result-q-text"></div>
    </div>
  </div>

  <div class="slots-section">
    <div class="slots-label">6つのテーマ</div>
    <div class="slots-grid" id="slots-grid"></div>
  </div>
</div>

<script>
const slots = [
  {
    name: "イベントへの本音",
    color: "#c084fc",
    qs: [
      "イベントが近づいてきて、今の気持ちを一言で言うと？",
      "今一番「楽しみ」と「緊張」どっちが勝ってる？",
      "当日に向けて、自分なりに大切にしていることは？"
    ]
  },
  {
    name: "ファンへの気持ち",
    color: "#f472b6",
    qs: [
      "来てくれる人に「これだけは伝えたい」一言は？",
      "当日、どんな距離感でファンと過ごしたい？",
      "来られない人にも届けたいこと、あるとしたら？"
    ]
  },
  {
    name: "当日の雰囲気",
    color: "#38bdf8",
    qs: [
      "今回のイベントならではの楽しさって何だと思う？",
      "当日どんな空気の会場にしたい？",
      "自分の見せ場はどこだと思う？"
    ]
  },
  {
    name: "3人でつくる空間",
    color: "#4ade80",
    qs: [
      "3人だからこそ生まれる、空気感って何だと思う？",
      "当日、メンバーのどんな素の姿が出そう？",
      "イベントが終わった後、3人でどんな話をしてると思う？"
    ]
  },
  {
    name: "来てくれる人へ",
    color: "#fb923c",
    qs: [
      "「こんな気持ちで来てほしい」を一言で言うと？",
      "「来てよかった」と思ってもらうために、一番大事にしたいことは？",
      "終わった後、どんな気持ちで帰ってほしい？"
    ]
  }
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const cx = 160, cy = 160, r = 152;
let angle = 0;
let spinning = false;
let phase = 1;
let selectedSlot = null;

function drawWheel(rot, items, colors) {
  const arc = (2 * Math.PI) / items.length;
  ctx.clearRect(0, 0, 320, 320);
  items.forEach((label, i) => {
    const start = rot + i * arc - Math.PI / 2;
    const end = start + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i] + '22';
    ctx.fill();
    ctx.strokeStyle = colors[i] + '66';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);
    ctx.fillStyle = colors[i];
    ctx.font = '700 11px "Zen Kaku Gothic New", sans-serif';
    ctx.textAlign = 'right';
    ctx.shadowColor = colors[i];
    ctx.shadowBlur = 8;
    const maxLen = 10;
    const text = label.length > maxLen ? label.slice(0, maxLen) + '…' : label;
    ctx.fillText(text, r - 10, 4);
    ctx.restore();
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0a0f';
  ctx.fill();
  ctx.strokeStyle = 'rgba(192,132,252,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(240,239,248,0.6)';
  ctx.font = '700 10px "Zen Kaku Gothic New", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 0;
  ctx.fillText('GO', cx, cy);
}

function getCurrentItems() {
  if (phase === 1) {
    return { items: slots.map(s => s.name), colors: slots.map(s => s.color) };
  } else {
    const qs = selectedSlot.qs;
    return { items: qs, colors: qs.map(() => selectedSlot.color) };
  }
}

drawWheel(0, slots.map(s => s.name), slots.map(s => s.color));

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;

  const panel = document.getElementById('result-panel');
  panel.classList.remove('lit', 'lit-q');
  document.getElementById('result-idle').style.display = 'block';
  document.getElementById('result-category').textContent = '';
  document.getElementById('result-topic').textContent = '';
  document.getElementById('result-q-text').textContent = '';

  const { items, colors } = getCurrentItems();
  const arc = (2 * Math.PI) / items.length;
  const extra = (8 + Math.floor(Math.random() * 4)) * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const total = extra;
  const duration = 3800;
  const startTime = performance.now();
  const startAngle = angle;

  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    angle = startAngle + total * ease;
    drawWheel(angle, items, colors);
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      angle = startAngle + total;
      drawWheel(angle, items, colors);
      spinning = false;
      document.getElementById('spin-btn').disabled = false;
      const norm = ((-(angle - Math.PI / 2)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const idx = Math.floor(norm / arc) % items.length;
      showResult(idx, items, colors);
    }
  }
  requestAnimationFrame(step);
}

function showResult(idx, items, colors) {
  const panel = document.getElementById('result-panel');
  document.getElementById('result-idle').style.display = 'none';

  if (phase === 1) {
    selectedSlot = slots[idx];
    document.getElementById('result-category').textContent = 'テーマ決定';
    document.getElementById('result-category').style.color = selectedSlot.color;
    document.getElementById('result-topic').textContent = selectedSlot.name;
    document.getElementById('result-topic').style.color = selectedSlot.color;
    setTimeout(() => panel.classList.add('lit'), 50);

    document.querySelectorAll('.slot-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    phase = 2;
    document.getElementById('dot0').classList.remove('active');
    document.getElementById('dot0').classList.add('done');
    document.getElementById('dot1').classList.add('active');
    document.getElementById('phase-label').textContent = 'STEP 2 — 質問を選ぶ';
    document.getElementById('spin-btn').textContent = 'もう一回まわす';
    document.getElementById('reset-btn').classList.add('visible');

    angle = 0;
    const { items: qItems, colors: qColors } = getCurrentItems();
    drawWheel(0, qItems, qColors);

  } else {
    const q = selectedSlot.qs[idx];
    document.getElementById('result-category').textContent = selectedSlot.name + ' の質問';
    document.getElementById('result-category').style.color = selectedSlot.color;
    document.getElementById('result-topic').textContent = selectedSlot.name;
    document.getElementById('result-topic').style.color = selectedSlot.color;
    document.getElementById('result-q-text').textContent = q;
    document.getElementById('result-q-text').style.color = selectedSlot.color;
    setTimeout(() => panel.classList.add('lit-q'), 50);

    document.querySelectorAll('.slot-item').forEach((el, i) => {
      if (el.classList.contains('active')) {
        el.querySelector('.slot-qs-text').style.display = 'none';
        const qEl = el.querySelector('.slot-q-active') || document.createElement('div');
        qEl.className = 'slot-q-active';
        qEl.style.color = selectedSlot.color;
        qEl.textContent = '▶ ' + q;
        if (!el.querySelector('.slot-q-active')) el.appendChild(qEl);
      }
    });

    document.getElementById('spin-btn').textContent = '質問を引き直す';
  }
}

function reset() {
  phase = 1;
  selectedSlot = null;
  angle = 0;
  document.getElementById('dot0').classList.add('active');
  document.getElementById('dot0').classList.remove('done');
  document.getElementById('dot1').classList.remove('active');
  document.getElementById('phase-label').textContent = 'STEP 1 — テーマを選ぶ';
  document.getElementById('spin-btn').textContent = 'まわす';
  document.getElementById('reset-btn').classList.remove('visible');

  const panel = document.getElementById('result-panel');
  panel.classList.remove('lit', 'lit-q');
  document.getElementById('result-idle').style.display = 'block';
  document.getElementById('result-category').textContent = '';
  document.getElementById('result-topic').textContent = '';
  document.getElementById('result-q-text').textContent = '';

  drawWheel(0, slots.map(s => s.name), slots.map(s => s.color));

  document.querySelectorAll('.slot-item').forEach(el => {
    el.classList.remove('active');
    const qActive = el.querySelector('.slot-q-active');
    if (qActive) qActive.remove();
    const qsText = el.querySelector('.slot-qs-text');
    if (qsText) qsText.style.display = '';
  });
}

const grid = document.getElementById('slots-grid');
slots.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slot-item';
  el.style.setProperty('--slot-color', s.color);
  el.innerHTML = `
    <div class="slot-name">
      <div class="slot-dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}80"></div>
      <span>${s.name}</span>
    </div>
    <div class="slot-qs-text">${s.qs.map(q => `・${q}`).join('<br>')}</div>
  `;
  grid.appendChild(el);
});
</script>
